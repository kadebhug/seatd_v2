name: integration

on:
  pull_request:
  push:
    branches: [main]

jobs:
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: seatd
          POSTGRES_USER: seatd
          POSTGRES_PASSWORD: seatd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seatd -d seatd"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - run: ./infra/database/scripts/check-migrations
