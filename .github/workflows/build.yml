name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: npm ci
      - run: dart pub get --directory packages/dart-seatd-client
      - run: flutter pub get --directory apps/waiter
      - run: flutter pub get --directory apps/display
      - run: go build ./apps/api/cmd/api ./apps/worker/cmd/worker ./apps/realtime/cmd/realtime
      - run: npm run build --workspaces --if-present
      - run: dart analyze
        working-directory: packages/dart-seatd-client
      - run: flutter build web --debug --no-pub --target lib/main.dart
        working-directory: apps/waiter
      - run: flutter build web --debug --no-pub --target lib/main.dart
        working-directory: apps/display
